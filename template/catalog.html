<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Paays · Internal Documents</title>
  <style>
    :root {
      --bg: #0b1f3a;
      --card: #11294d;
      --card-hover: #163461;
      --ink: #e6edf6;
      --muted: #93a7c4;
      --accent: #4f8cff;
      --line: #20406e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 64px 20px;
    }
    .wrap { width: 100%; max-width: 640px; }
    header { margin-bottom: 32px; }
    .kicker {
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin: 0 0 8px;
    }
    h1 { font-size: 26px; margin: 0 0 6px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 15px; margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin: 0 0 12px; }
    a.doc {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px 20px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }
    a.doc:hover { background: var(--card-hover); border-color: var(--accent); }
    a.doc:active { transform: translateY(1px); }
    .doc-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    .doc-desc { font-size: 13px; color: var(--muted); margin: 0; }
    .doc-title::after { content: " \2192"; color: var(--accent); }
    footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="kicker">Paays</p>
      <h1>Internal Documents</h1>
      <p class="sub">Each document is individually password protected. Request access from Mauricio.</p>
    </header>
    <ul>
<!--DOCS-->
    </ul>
    <footer>Paays internal use only. Do not share links or passwords outside the company.</footer>
  </main>
</body>
</html>
